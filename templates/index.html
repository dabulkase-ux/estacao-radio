<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Central de Rádio</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172033 0%,
                    #0b0f17 45%,
                    #070a10 100%
                );

            color: #f5f7fa;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }

        .title-area h1 {
            font-size: 32px;
            letter-spacing: -0.8px;
        }

        .title-area p {
            margin-top: 6px;
            color: #8f9aaa;
            font-size: 14px;
        }

        .central-status {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 12px 16px;

            border-radius: 12px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: #555;
        }

        .status-dot.online {
            background: #35e58a;

            box-shadow:
                0 0 12px
                rgba(
                    53,
                    229,
                    138,
                    0.7
                );
        }

        .status-dot.offline {
            background: #ff4d67;

            box-shadow:
                0 0 12px
                rgba(
                    255,
                    77,
                    103,
                    0.6
                );
        }

        .summary {
            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 16px;

            margin-bottom: 30px;
        }

        .summary-card {
            padding: 20px;

            border-radius: 16px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.045
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            backdrop-filter:
                blur(10px);
        }

        .summary-card span {
            display: block;

            color: #8f9aaa;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .summary-card strong {
            font-size: 28px;
            font-weight: 600;
        }

        .section-title {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom: 15px;
        }

        .section-title h2 {
            font-size: 20px;
        }

        .section-title span {
            color: #737f90;
            font-size: 13px;
        }

        .stations {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 16px;
        }

        .station {
            position: relative;

            padding: 20px;

            border-radius: 18px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.045
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .station:hover {
            transform:
                translateY(-2px);

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.16
                );
        }

        .station-top {
            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            margin-bottom: 22px;
        }

        .station-name {
            font-size: 20px;
            font-weight: 600;
        }

        .station-id {
            margin-top: 5px;

            color: #778294;

            font-size: 12px;
        }

        .station-status {
            display: flex;

            align-items:
                center;

            gap: 7px;

            padding: 6px 9px;

            border-radius: 8px;

            font-size: 11px;

            font-weight: 600;
        }

        .station-status.online {
            color: #35e58a;

            background:
                rgba(
                    53,
                    229,
                    138,
                    0.08
                );
        }

        .station-status.offline {
            color: #ff667c;

            background:
                rgba(
                    255,
                    102,
                    124,
                    0.08
                );
        }

        .station-status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                currentColor;
        }

        .station-info {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-bottom: 16px;
        }

        .info {
            padding: 12px;

            border-radius: 10px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.14
                );
        }

        .info span {
            display: block;

            color: #717d8e;

            font-size: 11px;

            margin-bottom: 5px;
        }

        .info strong {
            font-size: 14px;
            font-weight: 500;
        }

        /* =========================
           NÍVEL SONORO
        ========================= */

        .sound-section {
            margin-top: 4px;
        }

        .sound-header {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom: 8px;
        }

        .sound-label {
            color: #717d8e;

            font-size: 11px;
        }

        .sound-value {
            color: #f5f7fa;

            font-size: 13px;

            font-weight: 600;
        }

        .sound-bar {
            width: 100%;

            height: 8px;

            overflow: hidden;

            border-radius: 999px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );
        }

        .sound-fill {
            height: 100%;

            width: 0%;

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    #35e58a,
                    #f5d742,
                    #ff667c
                );

            /* Telemetria: sem animação de 250 ms sobre o valor mais recente. */
        }

        .sound-scale {
            display: flex;

            justify-content:
                space-between;

            margin-top: 5px;

            color: #555f6e;

            font-size: 9px;
        }

        .empty {
            padding: 60px 20px;

            text-align: center;

            border-radius: 18px;

            border:
                1px dashed
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            color: #737f90;
        }

        .empty strong {
            display: block;

            color: #aab2bf;

            font-size: 16px;

            margin-bottom: 7px;
        }

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .summary {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <header>

        <div class="title-area">

            <h1>
                Central de Rádio
            </h1>

            <p>
                Monitoramento das estações
                conectadas à central
            </p>

        </div>


        <div class="central-status">

            <div
                id="centralDot"
                class="status-dot"
            ></div>

            <span id="centralStatus">
                Central desconectada
            </span>

            <span id="centralTransport">Conexão: USB Serial</span>

        </div>

    </header>


    <section class="summary">

        <div class="summary-card">

            <span>
                Estações encontradas
            </span>

            <strong id="totalStations">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Estações online
            </span>

            <strong id="onlineStations">
                0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Estações offline
            </span>

            <strong id="offlineStations">
                0
            </strong>

        </div>

    </section>


    <div class="section-title">

        <h2>
            Estações
        </h2>

        <span id="lastUpdate">
            Aguardando dados...
        </span>

    </div>


    <section
        id="stations"
        class="stations"
    >

        <div class="empty">

            <strong>
                Nenhuma estação encontrada
            </strong>

            A central ainda não recebeu
            sinais de rádio.

        </div>

    </section>


</div>


<script>

    const backendUrl = ""; // PUBLIC_BACKEND_URL
    const publicMode = false;
    const socket = typeof io === "function"
        ? io(backendUrl || undefined, {timeout: 5000, reconnectionDelayMax: 10000})
        : {on() {}, connected: false};
    const resultadosPing = new Map();
    let ultimasEstacoes = {};
    let ultimaAtualizacao = Date.now();
    let revisao = 0;
    let servidorOffline = false;
    let dadosPendentes = null;
    let framePendente = false;
    const diagnostico = typeof location !== "undefined" &&
        new URLSearchParams(location.search).get("diagnostico") === "1";

    function marcarOffline() {
        dadosPendentes = null;
        if (!servidorOffline) revisao++;
        servidorOffline = true;
        atualizarCentral({connected: false});
        atualizarEstacoes(Object.fromEntries(Object.entries(ultimasEstacoes).map(
            ([id, station]) => [id, {...station, connected: false}]
        )));
        lastUpdate.textContent = "Sem conexão com o servidor";
    }

    function aplicarDados(dados) {
        revisao++;
        servidorOffline = false;
        ultimaAtualizacao = Date.now();
        dadosPendentes = dados;
        if (framePendente) return;
        framePendente = true;
        const inicioFrame = diagnostico ? performance.now() : 0;
        const renderizar = () => {
            framePendente = false;
            const atual = dadosPendentes;
            dadosPendentes = null;
            if (!atual) return; // Desconexão invalida um frame online pendente.
            atualizarCentral(atual);
            atualizarEstacoes(atual.stations || {});
            lastUpdate.textContent = "Atualizado agora";
            if (diagnostico) console.debug("[LATENCIA] primeiro evento do frame -> DOM (ms)",
                performance.now() - inicioFrame, "transporte", socket.io?.engine?.transport?.name || "HTTP");
        };
        if (typeof requestAnimationFrame === "function") requestAnimationFrame(renderizar);
        else renderizar();
    }

    socket.on("disconnect", () => {
        marcarOffline();
    });
    socket.on("connect_error", marcarOffline);

    document.addEventListener("click", (evento) => {
        const botao = evento.target.closest("button[data-ping]");
        if (!botao || publicMode) return;
        const id = botao.dataset.ping;
        if (resultadosPing.get(id) === "Testando...") return;
        resultadosPing.set(id, "Testando...");
        mostrarResultadoPing(id);
        socket.timeout(11000).emit("radio_ping", {id}, (erro, resposta) => {
            resultadosPing.set(id, erro ? "Sem resposta do servidor" :
                resposta.ok ? "Resposta confirmada" : "Falha: " + resposta.status);
            mostrarResultadoPing(id);
        });
    });

    function mostrarResultadoPing(id) {
        document.querySelectorAll("button[data-ping]").forEach(botao => {
            if (botao.dataset.ping === id) {
                botao.disabled = resultadosPing.get(id) === "Testando...";
                botao.nextElementSibling.textContent = resultadosPing.get(id) || "";
            }
        });
    }


    const centralDot =
        document.getElementById(
            "centralDot"
        );


    const centralStatus =
        document.getElementById(
            "centralStatus"
        );


    const totalStations =
        document.getElementById(
            "totalStations"
        );


    const onlineStations =
        document.getElementById(
            "onlineStations"
        );


    const offlineStations =
        document.getElementById(
            "offlineStations"
        );


    const stationsContainer =
        document.getElementById(
            "stations"
        );


    const lastUpdate =
        document.getElementById(
            "lastUpdate"
        );


    socket.on(
        "connect",
        () => {

            console.log(
                "Socket conectado."
            );

        }
    );


    socket.on(
        "radio_data",
        (dados) => {

            aplicarDados(dados);

        }
    );


    function atualizarCentral(
        dados
    ) {
        if (dados.transport) {
            document.getElementById("centralTransport").textContent =
                "Conexão: " + (dados.transport === "bluetooth" ? "Bluetooth" : "USB Serial");
        }

        if (dados.connected) {

            centralDot.className =
                "status-dot online";

            centralStatus.textContent =
                "Central conectada";

        }

        else {

            centralDot.className =
                "status-dot offline";

            centralStatus.textContent =
                "Central desconectada";

        }

    }


    function atualizarEstacoes(
        stations
    ) {
        ultimasEstacoes = stations;

        const lista =
            Object.values(
                stations
            );


        const total =
            lista.length;


        const online =
            lista.filter(
                station =>
                    station.connected
            ).length;


        const offline =
            total - online;


        totalStations.textContent =
            total;


        onlineStations.textContent =
            online;


        offlineStations.textContent =
            offline;


        if (total === 0) {

            stationsContainer.innerHTML = `

                <div class="empty">

                    <strong>
                        Nenhuma estação encontrada
                    </strong>

                    A central ainda não recebeu
                    sinais de rádio.

                </div>

            `;

            return;

        }


        stationsContainer.innerHTML =
            lista
                .sort(
                    (a, b) =>
                        a.id.localeCompare(
                            b.id
                        )
                )
                .map(
                    station =>
                        criarCard(
                            station
                        )
                )
                .join("");

    }


    function criarCard(
        station
    ) {

        const online =
            station.connected;


        const statusClass =
            online
                ? "online"
                : "offline";


        const statusText =
            online
                ? "ONLINE"
                : "OFFLINE";


        let intervalo =
            "—";


        if (
            station.interval !== null &&
            station.interval !== undefined
        ) {

            intervalo =
                `${station.interval}s`;

        }


        /*
         * O micro:bit está enviando o nível
         * bruto do microfone.
         *
         * Consideramos 255 como valor máximo
         * visual da barra.
         */

        const MAX_SOM = 255;


        let som =
            Number(
                station.sound ?? 0
            );


        if (
            !Number.isFinite(
                som
            )
        ) {

            som = 0;

        }


        som =
            Math.max(
                0,
                Math.min(
                    MAX_SOM,
                    som
                )
            );


        const porcentagem =
            (
                som / MAX_SOM
            ) * 100;


        return `

            <article class="station">

                <button type="button" data-ping="${escaparHTML(station.id)}"
                    ${publicMode ? "hidden" : ""}
                    ${resultadosPing.get(station.id) === "Testando..." ? "disabled" : ""}>Testar comunicação</button>
                <span role="status">${escaparHTML(resultadosPing.get(station.id) || "")}</span>

                <div class="station-top">

                    <div>

                        <div class="station-name">

                            ${escaparHTML(
                                station.name ||
                                station.id
                            )}

                        </div>

                        <div class="station-id">

                            ID:
                            ${escaparHTML(
                                station.id
                            )}

                        </div>

                    </div>


                    <div
                        class="
                            station-status
                            ${statusClass}
                        "
                    >

                        <div
                            class="
                                station-status-dot
                            "
                        ></div>

                        ${statusText}

                    </div>

                </div>


                <div class="station-info">

                    <div class="info">

                        <span>
                            Intervalo
                        </span>

                        <strong>
                            ${intervalo}
                        </strong>

                    </div>


                    <div class="info">

                        <span>
                            Nível sonoro
                        </span>

                        <strong>
                            ${som}
                        </strong>

                    </div>

                </div>


                <div class="sound-section">

                    <div class="sound-header">

                        <span class="sound-label">
                            Som detectado
                        </span>

                        <span class="sound-value">
                            ${som} / ${MAX_SOM}
                        </span>

                    </div>


                    <div class="sound-bar">

                        <div
                            class="sound-fill"
                            style="
                                width: ${porcentagem}%;
                            "
                        ></div>

                    </div>


                    <div class="sound-scale">

                        <span>
                            0
                        </span>

                        <span>
                            85
                        </span>

                        <span>
                            170
                        </span>

                        <span>
                            255
                        </span>

                    </div>

                </div>

            </article>

        `;

    }


    function escaparHTML(
        valor
    ) {

        return String(valor)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    async function carregarDados() {

        const inicio = revisao;

        try {

            const resposta =
                await fetch(
                    backendUrl + "/api/data",
                    {cache: "no-store", ...(typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function" ? {signal: AbortSignal.timeout(5000)} : {})}
                );


            if (!resposta.ok) {

                return;

            }


            const dados =
                await resposta.json();


            // Uma resposta HTTP antiga não deve sobrescrever Socket.IO mais recente.
            if (inicio === revisao) aplicarDados(dados);

        }

        catch (erro) {

            console.error(
                "Erro ao consultar API:",
                erro
            );

        }

    }


    carregarDados();

    if (publicMode) {
        // Também cobre backend congelado/CDN Socket.IO indisponível.
        setInterval(() => {
            if (Date.now() - ultimaAtualizacao > 8000) marcarOffline();
            if (!socket.connected) carregarDados();
        }, 2000);
    }

</script>

</body>

</html>
